# Legacy URLs → new homes, rendered into public/_redirects by layouts/home.redirects (Netlify).
# Netlify matches with or without a trailing slash, and an existing file wins over a rule,
# so only paths that no longer exist belong here. Generic rules (every page's .html twin,
# page/1/ of every list) are generated in the template; don't repeat them.
#
#   from:   path (Netlify syntax: :placeholder, trailing *), or a full https://host/… URL
#   to:     target (use :splat for the * match)
#   status: 301 (default)
#   force:  true to apply even when a file exists at `from` (needed for other hosts)

legacy:
  # Old Django/ButterCMS site (2017–2019)
  - { from: /blog/rss, to: /blog/index.xml }          # the old blog feed, still in subscribers' readers
  - { from: /feed, to: /index.xml }
  - { from: /blog/march-month-in-review, to: /blog/march-month-in-review-2017/ }
  - { from: /reader.html, to: / }                     # Koipun Reader (retired product)
  - { from: /reader, to: / }
  - { from: /newsletter, to: /blog/ }
  - { from: /learnmore/*, to: /how-to-learn-japanese/ }
  - { from: /learn-japanese-with-games-and-manga, to: /blog/ }
  - { from: /privacy, to: /privacy-and-terms/ }            # old Django site and classroom.koipun.com
  # 2016 site
  - { from: /2016/08/01/a-visual-study-method-for-heisigs-remembering-the-kanji, to: /blog/learn-kanji-heisig/ }
  - { from: /2016/08/01/a-visual-study-method-for-heisigs-remembering-the-kanji/*, to: /blog/learn-kanji-heisig/ }   # WordPress /feed/, /amp/…
  - { from: /comments/feed, to: /index.xml }          # WordPress comment feed
  # 2015 Tumblr blog (blog.koipun.com): attach blog.koipun.com to the Netlify site as a domain alias
  - { from: "https://blog.koipun.com/post/110390648373/*", to: "https://www.koipun.com/blog/using-anki-to-learn-hiragana/", force: true }
  - { from: "https://blog.koipun.com/post/114272662048/*", to: "https://www.koipun.com/blog/genki-annihilation-anki-deck/", force: true }
  - { from: "https://blog.koipun.com/*", to: "https://www.koipun.com/blog/", force: true }
