{{/*
  Questions and answers, always visible (no JavaScript). Params: heading, id, items: [{q, a (markdown)}]
*/}}
<section {{ with .id }}id="{{ . }}" {{ end }}class="container-page scroll-mt-24 py-12 sm:py-16">
  <div class="mx-auto max-w-3xl">
    {{ with .heading }}<h2 class="mb-8 text-3xl font-black tracking-tight sm:text-4xl">{{ . }}</h2>{{ end }}
    <div class="divide-y divide-hairline card">
      {{- range .items }}
      <div class="p-6">
        <h3 class="text-xl font-semibold text-fg">{{ .q }}</h3>
        <div class="mt-3 space-y-3 text-pretty text-muted [&_a]:link-pen [&_strong]:text-fg">{{ .a | markdownify }}</div>
      </div>
      {{- end }}
    </div>
  </div>
</section>
